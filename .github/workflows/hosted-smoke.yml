name: Hosted DEMO smoke
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Verify hosted workflow
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const base = 'https://hisn-ot-prototype.vercel.app';
          const readiness = await fetch(`${base}/readyz`);
          assert.equal(readiness.status, 200, await readiness.text());
          const sessionResponse = await fetch(`${base}/api/v1/session`);
          assert.equal(sessionResponse.status, 200);
          const cookie = sessionResponse.headers.getSetCookie().map(x => x.split(';')[0]).join('; ');
          const session = await sessionResponse.json();
          assert.equal(session.runtimeMode, 'DEMO');
          const headers = {cookie, 'content-type': 'application/json', 'x-csrf-token': session.csrfToken};
          const preflightResponse = await fetch(`${base}/api/v1/connected-verification`, {headers: {cookie}});
          const preflightBody = await preflightResponse.text();
          assert.equal(preflightResponse.status, 200, preflightBody);
          const preflight = JSON.parse(preflightBody);
          assert.equal(preflight.nokiaConfigured, true);
          assert.equal(preflight.subscriberAuthorizationMode, 'SIMULATOR_FAST_OAUTH');
          assert.equal(preflight.fallbackAllowed, false);
          const comparisonResponse = await fetch(`${base}/api/v1/connected-verification`, {
            method: 'POST',
            headers,
            body: JSON.stringify({context: 'BOTH', stage: 'evidence'}),
          });
          const comparisonBody = await comparisonResponse.text();
          assert.equal(comparisonResponse.status, 200, comparisonBody);
          const comparison = JSON.parse(comparisonBody);
          assert.equal(comparison.stage, 'evidence-comparison');
          assert.equal(comparison.command.requestedSetpointPercent, 52);
          assert.equal(comparison.executions.length, 2);
          for (const execution of comparison.executions) {
            assert.equal(execution.command.requestedSetpointPercent, 52);
            assert.equal(execution.evidence.filter(call => call.requestStatus === 'SUCCEEDED' && call.provenance === 'SANDBOX').length, 5);
            assert.equal(execution.evidence.some(call => call.provenance === 'SIMULATED' || call.provenance === 'CACHE'), false);
            const numberVerification = execution.evidence.find(call => call.tool === 'NUMBER_VERIFICATION');
            assert.equal(numberVerification.requestStatus, 'SUCCEEDED');
            assert.equal(numberVerification.redactedResult.authorizationFlow, 'SIMULATOR_FAST_OAUTH');
          }
          const simSwap = execution => {
            const evidence = execution.evidence.find(call => call.tool === 'SIM_SWAP');
            assert.ok(evidence, 'SIM Swap evidence is missing');
            return evidence.redactedResult.swapped;
          };
          assert.equal(simSwap(comparison.executions[0]), false);
          assert.equal(simSwap(comparison.executions[1]), true);
          async function control(action) {
            const response = await fetch(`${base}/api/v1/judge-run/control`, {method: 'POST', headers, body: JSON.stringify({action})});
            assert.equal(response.status, 200);
            return response.json();
          }
          let snapshot = await control('RESET');
          for (let step = 0; step < 20 && snapshot.run.playbackStatus !== 'COMPLETE'; step++) {
            snapshot = await control('NEXT');
            assert.notEqual(snapshot.run.playbackStatus, 'FAILED_SAFE');
          }
          assert.equal(snapshot.run.playbackStatus, 'COMPLETE');
          assert.equal(snapshot.artifacts.decision.state, 'BLOCK_AND_CONTAIN');
          assert.equal(snapshot.incidentAvailable, true);
          const report = await fetch(`${base}/api/v1/judge-run/${snapshot.run.id}/incident`, {headers});
          assert.equal(report.status, 200);
          console.log(JSON.stringify({
            runId: snapshot.run.id,
            decision: snapshot.artifacts.decision.state,
            report: 'exported',
            connectedCorrelationIds: comparison.executions.map(execution => execution.correlationId),
          }));
          await control('RESET');
          JS
